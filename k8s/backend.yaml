apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-concierge-backend
spec:
  replicas: 2
  selector:
    matchLabels: {app: travel-concierge-backend}
  template:
    metadata:
      labels: {app: travel-concierge-backend}
    spec:
      securityContext: {runAsNonRoot: true}
      containers:
        - name: backend
          image: venk196/travel-concierge-backend:latest
          ports: [{containerPort: 8080}]
          env:
            - {name: MODEL_PROVIDER, value: mock}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 15
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: travel-concierge-backend
spec:
  selector: {app: travel-concierge-backend}
  ports: [{port: 8080, targetPort: 8080}]

