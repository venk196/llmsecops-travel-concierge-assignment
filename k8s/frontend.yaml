apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-concierge-frontend
spec:
  replicas: 2
  selector:
    matchLabels: {app: travel-concierge-frontend}
  template:
    metadata:
      labels: {app: travel-concierge-frontend}
    spec:
      securityContext: {runAsNonRoot: true}
      containers:
        - name: frontend
          image: venk196/travel-concierge-frontend:latest
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: travel-concierge-frontend
spec:
  type: LoadBalancer
  selector: {app: travel-concierge-frontend}
  ports: [{port: 80, targetPort: 8080}]

