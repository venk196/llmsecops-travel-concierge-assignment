services:
  backend:
    build: ./backend
    environment:
      MODEL_PROVIDER: ${MODEL_PROVIDER:-mock}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL_FAST: ${OLLAMA_MODEL_FAST:-gemma2:2b}
      OLLAMA_MODEL_QUALITY: ${OLLAMA_MODEL_QUALITY:-llama3.1:8b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [llmnet]

  frontend:
    build: ./frontend
    ports:
      - "5000:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks: [llmnet]

networks:
  llmnet:
    driver: bridge

