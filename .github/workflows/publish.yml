name: Publish approved images
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/travel-concierge-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/travel-concierge-backend:latest
      - uses: docker/build-push-action@v7.4.0
        with:
          context: frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/travel-concierge-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/travel-concierge-frontend:latest

