name: CI security and quality gates
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      - run: pytest tests -q --cov=app --cov-fail-under=80
        env: {PYTHONPATH: .}
      - run: bandit -r app -ll
      - run: pip-audit -r requirements.txt

  build-and-scan:
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t travel-backend:${{ github.sha }} backend
      - run: docker build -t travel-frontend:${{ github.sha }} frontend
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: travel-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: travel-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

